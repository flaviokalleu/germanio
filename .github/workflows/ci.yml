name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          CGO_ENABLED=0 go build -o ge ./cmd/ge
          CGO_ENABLED=0 go build -o germanio .

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Race checks
        run: go test -race ./compiler/... ./runtime/germanio ./tooling/...

      - name: Germanio examples and formatter
        run: |
          for file in examples/germanio/*.ge; do
            ./ge check "$file"
          done
          ./ge rodar examples/germanio/ola.ge
          ./ge rodar examples/germanio/fundamentos.ge
          ./ge rodar examples/germanio/genericos.ge
          ./ge rodar examples/germanio/numeros_genericos.ge
          ./ge testar examples/germanio
          ./ge testar examples/germanio --coverage
          ./ge rodar examples/germanio/imports.ge
          printf 'Flavio\n' | ./ge rodar examples/germanio/entrada.ge
          ./ge fmt examples/germanio --check

      - name: Check example files
        run: |
          for fg in $(find demo -name inicio.ge -type f); do
            echo "Checking $fg ..."
            ./germanio check "$fg"
          done
