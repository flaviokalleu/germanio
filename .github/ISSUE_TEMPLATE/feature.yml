name: Feature request
description: Something you want to describe in .ge and cannot, or cannot simply.
labels: [idea]
body:
  - type: textarea
    id: intent
    attributes:
      label: What do you want to describe?
      description: Say it in plain words, as you would explain it to a person. The intent matters more than a proposed syntax.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you write it today?
      description: The .ge you have now, if any, and what is hard about it.
