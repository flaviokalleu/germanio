# GoReleaser configuration (https://goreleaser.com). Releases run from
# .github/workflows/release.yml when a v* tag is pushed; see docs/RELEASING.md.
#
#   goreleaser check                      # validate this file
#   goreleaser release --snapshot --clean # build everything locally, publish nothing
version: 2

project_name: germanio

before:
  hooks:
    - go mod verify
    - go test ./... -count=1

builds:
  - id: ge
    main: ./cmd/ge
    binary: ge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/flaviokalleu/germanio/versao.Versao={{.Version}}
      - -X github.com/flaviokalleu/germanio/versao.Commit={{.ShortCommit}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: germanio
    main: .
    binary: germanio
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/flaviokalleu/germanio/versao.Versao={{.Version}}
      - -X github.com/flaviokalleu/germanio/versao.Commit={{.ShortCommit}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: germanio
    ids: [ge, germanio]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "germanio_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README.pt-BR.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "
      - "^docs\\(state\\)"
  groups:
    - title: Language
      regexp: '^(feat|fix)\((parser|lexer|compiler|resolver|syntax|intent)\)'
      order: 0
    - title: Security
      regexp: '^fix\(security\)'
      order: 1
    - title: Features
      regexp: '^feat'
      order: 2
    - title: Fixes
      regexp: '^fix'
      order: 3
    - title: Documentation
      regexp: '^docs'
      order: 4
    - title: Other changes
      order: 999

release:
  github:
    owner: flaviokalleu
    name: germanio
  name_template: "Germanio {{ .Version }}"
  prerelease: auto
  header: |
    Germanio {{ .Version }}. Germanio is pre-1.0: the language may still change, and changes of
    meaning go through GEPs (docs/gep). See CHANGELOG.md for what changed.

    ## Install

    Download the archive for your system below, check it against `checksums.txt`
    (`sha256sum -c checksums.txt --ignore-missing`), extract it and put `ge` on your PATH.
    Or build from source with Go: `go install github.com/flaviokalleu/germanio/cmd/ge@v{{ .Version }}`.

    ```bash
    ge --version
    ge new my_app
    ge run my_app/app.ge
    ```
