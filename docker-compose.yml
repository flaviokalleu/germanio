# Runs the application in ./my_app (created with `ge new my_app`) on port 8080.
# Data is kept in the germanio-data volume. Copy my_app/.env.exemplo to my_app/.env first.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./my_app:/app
      - germanio-data:/data
    restart: unless-stopped

volumes:
  germanio-data:
